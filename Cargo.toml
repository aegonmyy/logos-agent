[package]
name = "logos_agent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Logos-native autonomous agent: shielded wallet, composable skills, owner-approved spending, and A2A coordination with LEZ payment."
repository = "https://github.com/aegonmyy/logos-agent"

[lib]
# `cdylib` exports the C ABI the Logos Core module links against; `lib` keeps the
# crate usable as a normal Rust dependency (tests, the `agent` binary).
crate-type = ["lib", "cdylib"]

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
async-trait = "0.1"
base64 = "0.22.1"
clap = { version = "4.5.42", features = ["derive", "env"] }
# Signs the A2A Agent Card. The LEZ wallet's `sign_message` only covers public
# accounts and keycards — shielded (nullifier/viewing) keys produce ZK proofs,
# not message signatures — so the card carries its own self-certifying
# Ed25519 key, bound to the agent's LEZ account at card-build time.
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4.3"
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
log = "0.4.28"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.60", features = ["derive"] }
serde_json = "1.0.81"
sha2 = "0.10.8"
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }

[dev-dependencies]
test_fixtures = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
# Compiled sample LEZ programs (RISC0 guests) — used only by the live
# program.deploy/call/query integration test.
test_programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
