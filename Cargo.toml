[package]
name = "logos_agent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Logos-native autonomous agent: shielded wallet, composable skills, owner-approved spending, and A2A coordination with LEZ payment."
repository = "https://github.com/aegonmyy/logos-agent"

[lib]
# `cdylib` exports the C ABI the Logos Core module links against; `lib` keeps the
# crate usable as a normal Rust dependency (tests, the `agent` binary).
crate-type = ["lib", "cdylib"]

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
async-trait = "0.1"
base64 = "0.22.1"
clap = { version = "4.5.42", features = ["derive", "env"] }
hex = "0.4.3"
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }
log = "0.4.28"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.60", features = ["derive"] }
serde_json = "1.0.81"
sha2 = "0.10.8"
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }

[dev-dependencies]
test_fixtures = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }
