name: CI

# Clean-room build + fast tests.
#
# Runs on a self-hosted runner because compiling this crate pulls in the entire
# Logos Execution Zone (RISC0 prover, ZK circuits, sequencer), which exceeds
# GitHub's hosted-runner disk/time limits — there is no lighter subset, since any
# build of the crate compiles all of it.
#
# To keep the build honest despite the self-hosted runner, the job runs inside a
# FRESH container with a clean CARGO_HOME: the toolchain image is standard (as on
# hosted runners), but every dependency is re-fetched and re-compiled from a
# clean checkout each run — nothing from the host is reused.
#
# The clean-build job proves a from-scratch build; the `e2e` job runs the
# end-to-end integration tests against a real local LEZ sequencer (standalone
# mode, brought up via Docker): agent spending, the owner approval flow, the A2A
# two-agent marketplace, and the three category agents. The real-node tests
# (waku_live, codex_live, testnet_live) need external nodes and are evidenced
# under docs/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-build-and-test:
    runs-on: [self-hosted, linux]
    container:
      image: rust:1.94-bookworm
    env:
      RISC0_DEV_MODE: "1"
      CARGO_TERM_COLOR: always
      CARGO_HOME: /tmp/ci-cargo-home
      # NOTE: builds into the default workspace target/ (large host volume). This
      # leaves root-owned files in the shared workspace; the host `e2e` job's
      # reclaim step chowns them back before its own checkout.
      # Force Node 20 for JS actions: Node 24 in a container hits a runner
      # file-command ("save_state") bug on checkout.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libssl-dev pkg-config git curl ca-certificates python3-dev libpcsclite-dev

      - name: Install RISC0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install rust
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.5
          "$HOME/.risc0/bin/rzup" install cargo-risczero

      - name: Stub blockchain circuits (no proving in CI)
        run: |
          for d in pol poc poq zksign; do
            mkdir -p "$HOME/.logos-blockchain-circuits/$d"
            echo '{"type":"stub"}' > "$HOME/.logos-blockchain-circuits/$d/verification_key.json"
          done
          echo "v0.4.2" > "$HOME/.logos-blockchain-circuits/VERSION"

      - name: Build (clean)
        run: cargo build --lib --bins

      - name: Fast tests (no external services)
        run: |
          cargo test --lib
          cargo test --test full_skill_catalogue
          cargo test --test storage_messaging_skills

  e2e:
    # End-to-end integration test against a real local LEZ sequencer (standalone
    # mode). Runs directly on the self-hosted host (not in a container) so it can
    # use Docker — the test harness brings up the bedrock node + sequencer +
    # indexer + wallet via Docker and drives the agent against them.
    runs-on: [self-hosted, linux]
    env:
      RISC0_DEV_MODE: "1"
      CARGO_TERM_COLOR: always
      CARGO_HOME: /tmp/ci-cargo-home
      CARGO_TARGET_DIR: /tmp/ci-e2e-target
    steps:
      - name: Reclaim workspace (older runs may have left root-owned files)
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_WORKSPACE" 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Stub blockchain circuits (no proving in CI)
        run: |
          for d in pol poc poq zksign; do
            mkdir -p "$HOME/.logos-blockchain-circuits/$d"
            echo '{"type":"stub"}' > "$HOME/.logos-blockchain-circuits/$d/verification_key.json"
          done
          echo "v0.4.2" > "$HOME/.logos-blockchain-circuits/VERSION"

      # The three self-hosted runners (agent/vault/osm) share one home directory.
      # Their toolchain installs churn the rustup shims in ~/.cargo/bin concurrently,
      # which intermittently breaks `cargo` resolution mid-job (observed twice on
      # this box, 2026-08-28). Pin cargo to the real 1.94.0 toolchain binary, which
      # concurrent rustup operations do not touch. Matches rust-toolchain.toml.
      # The runner process runs as root (HOME=/root) but the toolchain is installed
      # under /home/ubuntu/.rustup, so $HOME-relative paths miss; scan both homes.
      - name: Pin cargo to the real 1.94.0 toolchain
        run: |
          for d in "$HOME/.rustup" /home/ubuntu/.rustup /root/.rustup; do
            bin="$d/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin"
            if [ -x "$bin/cargo" ]; then echo "$bin" >> "$GITHUB_PATH"; break; fi
          done

      - name: "E2E: agent on a local LEZ sequencer (shielded account, spend, hold)"
        run: cargo test --test agent_spending -- --nocapture --test-threads=1

      - name: "E2E: owner channel (approve, deny, reconfigure over Logos Messaging)"
        run: cargo test --test owner_approval_flow -- --nocapture --test-threads=1

      - name: "E2E: owner FFI handle (approve/deny/reconfigure through the Basecamp app boundary)"
        run: cargo test --test owner_ffi_e2e -- --nocapture --test-threads=1

      - name: "E2E: A2A marketplace (discovery, task lifecycle, LEZ payment, refund on cancel)"
        run: cargo test --test a2a_two_agents -- --nocapture --test-threads=1

      - name: "E2E: three LP-0008 use cases (vault, notary, paid task)"
        run: cargo test --test three_use_cases_local -- --nocapture --test-threads=1

      - name: "E2E: three category agents (storage, messaging, blockchain)"
        run: cargo test --test three_category_agents -- --nocapture --test-threads=1

  # Real-proof e2e at RISC0_DEV_MODE=0. The fast e2e job above runs at DEV_MODE=1
  # (fake proofs) for quick feedback; this job runs the same agent flows with
  # real Groth16 proofs so CI proves the proving path, not just the logic.
  # Real proving is slow (~10-15 min per shielded tx), so this job runs a
  # focused subset: the agent spending flow (shielded account, hold, spend) and
  # the shielded-send probe against the public LEZ testnet, which lands a
  # proof-bearing on-chain transaction (the evidence the submission cites).
  e2e-real-proof:
    runs-on: [self-hosted, linux]
    env:
      RISC0_DEV_MODE: "0"
      CARGO_TERM_COLOR: always
      CARGO_HOME: /tmp/ci-cargo-home
      CARGO_TARGET_DIR: /tmp/ci-e2e-target
    steps:
      - name: Reclaim workspace (older runs may have left root-owned files)
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_WORKSPACE" 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Stub blockchain circuits (no proving in CI)
        run: |
          for d in pol poc poq zksign; do
            mkdir -p "$HOME/.logos-blockchain-circuits/$d"
            echo '{"type":"stub"}' > "$HOME/.logos-blockchain-circuits/$d/verification_key.json"
          done
          echo "v0.4.2" > "$HOME/.logos-blockchain-circuits/VERSION"

      - name: Pin cargo to the real 1.94.0 toolchain
        run: |
          for d in "$HOME/.rustup" /home/ubuntu/.rustup /root/.rustup; do
            bin="$d/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin"
            if [ -x "$bin/cargo" ]; then echo "$bin" >> "$GITHUB_PATH"; break; fi
          done

      - name: "E2E (real proof): agent on a local LEZ sequencer (shielded account, spend, hold)"
        run: cargo test --test agent_spending -- --nocapture --test-threads=1

      - name: "E2E (real proof): shielded send on the public LEZ testnet (proof-bearing on-chain tx)"
        run: cargo test --test testnet_shielded_probe -- --ignored --nocapture --test-threads=1
        env:
          AGENT_TESTNET_URL: https://testnet.lez.logos.co
        # The public testnet flaps (its sequencer goes up and down behind an
        # nginx that returns 502). The durable evidence is the committed RPC
        # snapshot (271,076 bytes, block 42709, docs/SHIELDED_TESTNET_PROOF.md);
        # this step re-lands equivalent evidence when the testnet is up, but
        # must not red CI when it is down. The required real-proof lane is the
        # local agent_spending step above (deterministic, DEV_MODE=0).
        continue-on-error: true
