name: CI

# Builds the agent and runs its fast, hermetic tests. Runs on a self-hosted
# runner because compiling the crate pulls in the full Logos Execution Zone
# dependency tree (RISC0, circuits, sequencer), which does not fit GitHub's
# hosted runners. The chain/real-node tests (agent_spending, a2a_two_agents,
# waku_live, codex_live, testnet_live) run separately against local services and
# are documented under docs/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, linux]
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --lib --bins

      - name: Fast tests (no external services)
        run: |
          cargo test --lib
          cargo test --test full_skill_catalogue
          cargo test --test storage_messaging_skills
